[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armctrl"
version = "0.6.0rc3"
description = "Safe ARX5 arm control interface for Roboclaw"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "arx5-interface==0.1.2; sys_platform == 'linux'",
  "figaroh==0.3.1; sys_platform == 'linux'",
  "numpy>=1.26",
  "pin==4.0.0; sys_platform == 'linux'",
  "PyYAML>=6.0.2",
  "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]
lerobot = [
  "lerobot>=0.4.0",
  "lerobot-robot-arx5==0.1.2; sys_platform == 'linux'",
  "lerobot-teleoperator-arx5==0.1.1; sys_platform == 'linux'",
]

[project.scripts]
armctrl = "armctrl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
